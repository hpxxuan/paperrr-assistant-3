<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr 2.0 - 雲端計畫助理</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { background-color: #FFF9FA; font-family: 'Noto Sans TC', sans-serif; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid #FFFFFF; box-shadow: 0 25px 50px -12px rgba(255, 182, 193, 0.2); }
        .pink-gradient { background: linear-gradient(135deg, #FF5E9B 0%, #FF82BA 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #FFD1E3; border-radius: 10px; }
        .calendar-cell { aspect-ratio: 1/1.1; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .calendar-cell:hover { transform: scale(1.02); z-index: 10; }
        .tag-pill { font-size: 10px; padding: 2px 8px; border-radius: 50px; color: white; margin-bottom: 2px; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

<div id="app" v-cloak class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col lg:flex-row justify-between items-center mb-12 gap-8">
        <div class="flex items-center gap-6">
            <div class="w-16 h-16 pink-gradient rounded-[2rem] flex items-center justify-center text-white shadow-2xl shadow-pink-200">
                <i data-lucide="sparkles" class="w-8 h-8"></i>
            </div>
            <div>
                <h1 class="text-5xl md:text-7xl font-black text-slate-800 tracking-tighter">
                    Paperrr<span class="text-orange-500">✷2.0</span>
                </h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="bg-green-50 text-green-600 px-3 py-1 rounded-full text-[10px] font-bold border border-green-100 flex items-center gap-1">
                        <i data-lucide="cloud" class="w-3 h-3"></i> 雲端實時同步中
                    </span>
                </div>
            </div>
        </div>

        <nav class="flex bg-white p-2 rounded-full shadow-xl border border-pink-50">
            <button @click="view = 'year'" :class="view === 'year' ? 'active-pill' : 'inactive-pill'">年度計畫</button>
            <button @click="view = 'month'" :class="view === 'month' ? 'active-pill' : 'inactive-pill'">月度概覽</button>
            <button @click="view = 'week'" :class="view === 'week' ? 'active-pill' : 'inactive-pill'">週度執行</button>
        </nav>
    </header>

    <!-- 月度視圖 (核心功能) -->
    <main v-if="view === 'month'" class="animate-in fade-in slide-in-from-bottom-4 duration-500">
        <div class="glass-card rounded-[3.5rem] p-6 md:p-10 mb-12">
            <div class="flex justify-between items-center mb-10">
                <button @click="changeMonth(-1)" class="p-3 bg-pink-50 rounded-2xl text-pink-500 hover:bg-pink-100"><i data-lucide="chevron-left"></i></button>
                <h2 class="text-3xl font-black text-slate-800">{{ currentYear }}年 {{ currentMonth + 1 }}月</h2>
                <button @click="changeMonth(1)" class="p-3 bg-pink-50 rounded-2xl text-pink-500 hover:bg-pink-100"><i data-lucide="chevron-right"></i></button>
            </div>

            <div class="grid grid-cols-7 gap-1 md:gap-3">
                <div v-for="d in ['一','二','三','四','五','六','日']" class="text-center text-orange-300 font-black text-xs pb-4 uppercase tracking-widest">{{ d }}</div>
                
                <div v-for="empty in firstDayOffset" class="calendar-cell bg-slate-50/30 rounded-3xl"></div>
                
                <div v-for="day in daysInMonth" :key="day" @click="openEditModal(day)" class="calendar-cell bg-white border border-slate-50 rounded-3xl p-3 relative cursor-pointer shadow-sm">
                    <span :class="isToday(day) ? 'bg-pink-500 text-white shadow-lg' : 'text-slate-300'" class="text-[11px] font-black w-6 h-6 flex items-center justify-center rounded-lg">{{ day }}</span>
                    <div class="mt-1 space-y-1 overflow-hidden">
                        <div v-for="plan in getPlansByDate(day)" :key="plan.id" :style="{ backgroundColor: plan.color }" class="tag-pill truncate shadow-sm">
                            {{ plan.text }}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 雙欄布局 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <!-- 計畫規劃 -->
            <div>
                <div class="flex items-center gap-3 mb-6"><i data-lucide="target" class="text-pink-500"></i><h3 class="text-2xl font-black text-slate-800">計畫規劃✦</h3></div>
                <div class="space-y-4">
                    <div v-for="plan in allPlans" :key="plan.id" class="bg-white p-5 rounded-[2rem] border border-pink-50 flex items-center shadow-md hover:shadow-xl transition-all">
                        <span class="bg-pink-50 text-pink-500 px-4 py-2 rounded-full text-xs font-black mr-4">{{ plan.date }}</span>
                        <span class="font-bold text-slate-700 flex-1">{{ plan.text }}</span>
                        <i data-lucide="chevron-right" class="text-slate-200"></i>
                    </div>
                </div>
            </div>

            <!-- 代辦清單 -->
            <div>
                <div class="flex items-center gap-3 mb-6"><i data-lucide="list-todo" class="text-orange-500"></i><h3 class="text-2xl font-black text-slate-800">代辦清單✦</h3></div>
                <div class="bg-white p-4 rounded-[2rem] shadow-xl border border-pink-100 flex gap-3 mb-6">
                    <input v-model="quickTodo" @keyup.enter="addQuickTodo" placeholder="快速新增未安排日期的計畫..." class="flex-1 bg-transparent outline-none px-4 font-bold text-slate-600">
                    <button @click="addQuickTodo" class="pink-gradient p-4 rounded-2xl text-white shadow-lg"><i data-lucide="send"></i></button>
                </div>
                <div class="space-y-3">
                    <div v-for="(todo, index) in todos" :key="index" class="bg-white p-5 rounded-[1.5rem] border border-pink-50 flex items-center group">
                        <button @click="todo.done = !todo.done" class="mr-4">
                            <i v-if="todo.done" data-lucide="check-circle-2" class="text-pink-500"></i>
                            <i v-else data-lucide="circle" class="text-pink-100 group-hover:text-pink-300"></i>
                        </button>
                        <span :class="todo.done ? 'text-slate-300 line-through' : 'text-slate-700'" class="font-bold">{{ todo.text }}</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 年度與週度模式 (佔位提示) -->
    <div v-else class="py-32 text-center text-slate-300 italic text-xl font-bold">
        該模式正在同步雲端數據中... ☕
    </div>

    <!-- 編輯 Modal -->
    <div v-if="modal.show" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl animate-in zoom-in-95 duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black text-slate-800">新增 {{ modal.date }} 日計畫</h3>
                <button @click="modal.show = false"><i data-lucide="x" class="text-slate-400"></i></button>
            </div>
            <input v-model="modal.text" placeholder="今天想達成什麼目標？" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 mb-4 outline-none focus:border-pink-300 font-bold">
            <button @click="savePlan" class="w-full pink-gradient py-5 rounded-2xl text-white font-black tracking-widest shadow-xl">儲存計畫</button>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const view = ref('month');
            const currentYear = ref(2026);
            const currentMonth = ref(4); // 5月
            const quickTodo = ref('');
            
            const modal = ref({ show: false, date: null, text: '' });
            const todos = ref([
                { text: '整理產品展示腳本', done: false },
                { text: '回覆官方 IG 留言', done: true }
            ]);

            const allPlans = ref([
                { id: 1, date: '12', text: '泰瑞-品心', color: '#7FE5B6' },
                { id: 2, date: '13', text: '月會', color: '#FF9ECA' },
                { id: 3, date: '15', text: '腳本討論', color: '#FF9ECA' },
                { id: 4, date: '15', text: '美眼儀', color: '#7FBFFF' },
                { id: 5, date: '18', text: '薇佳20:00', color: '#FFAA66' }
            ]);

            const daysInMonth = computed(() => new Date(currentYear.value, currentMonth.value + 1, 0).getDate());
            const firstDayOffset = computed(() => {
                let d = new Date(currentYear.value, currentMonth.value, 1).getDay();
                return d === 0 ? 6 : d - 1;
            });

            const getPlansByDate = (day) => allPlans.value.filter(p => p.date == day);
            const isToday = (day) => day === 14 && currentMonth.value === 4;

            const openEditModal = (day) => {
                modal.value = { show: true, date: day, text: '' };
            };

            const savePlan = () => {
                if (modal.value.text) {
                    allPlans.value.push({
                        id: Date.now(),
                        date: String(modal.value.date),
                        text: modal.value.text,
                        color: '#FF9ECA'
                    });
                }
                modal.value.show = false;
                nextTick(() => lucide.createIcons());
            };

            const addQuickTodo = () => {
                if (quickTodo.value) {
                    todos.value.unshift({ text: quickTodo.value, done: false });
                    quickTodo.value = '';
                }
                nextTick(() => lucide.createIcons());
            };

            onMounted(() => lucide.createIcons());

            return { 
                view, currentYear, currentMonth, daysInMonth, firstDayOffset, 
                getPlansByDate, isToday, allPlans, todos, quickTodo, modal,
                openEditModal, savePlan, addQuickTodo
            };
        }
    }).mount('#app');
</script>

<style>
    .active-pill { @apply bg-pink-500 text-white shadow-xl px-8 py-3 rounded-full text-sm font-black transition-all; }
    .inactive-pill { @apply text-pink-400 hover:bg-pink-50 px-8 py-3 rounded-full text-sm font-black transition-all; }
</style>
</body>
</html>
