<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Assistant Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .app-container { max-width: 480px; min-height: 100vh; background: #ffffff; margin: 0 auto; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .glass-nav { backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.8); border-top: 1px solid #eee; }
        .safe-area-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 70px); }
        input:focus { outline: none; border-color: #6366f1; }
    </style>
</head>
<body>

<div id="app" class="app-container flex flex-col">
    <!-- Header -->
    <header class="p-6 pb-2">
        <h1 class="text-2xl font-bold text-gray-800">{{ currentTabName }}</h1>
        <p class="text-sm text-gray-500">{{ todayDate }}</p>
    </header>

    <main class="flex-grow p-6 safe-area-bottom">
        
        <!-- Tab 1: 任務清單 -->
        <div v-if="activeTab === 'todo'" class="space-y-4">
            <div class="flex gap-2 mb-6">
                <input v-model="newTask" @keyup.enter="addTodo" type="text" placeholder="新增任務..." class="flex-1 bg-gray-100 rounded-2xl px-4 py-3 text-sm">
                <button @click="addTodo" class="bg-indigo-600 text-white p-3 rounded-2xl">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            <div v-for="(item, index) in todos" :key="index" class="flex items-center p-4 bg-gray-50 rounded-2xl transition-all" :class="{'opacity-50': item.done}">
                <input type="checkbox" v-model="item.done" class="w-5 h-5 rounded-full border-gray-300 text-indigo-600 focus:ring-indigo-500">
                <span class="ml-3 text-gray-700" :class="{'line-through': item.done}">{{ item.text }}</span>
            </div>
        </div>

        <!-- Tab 2: 行程規劃 (簡化版) -->
        <div v-if="activeTab === 'calendar'" class="space-y-4">
            <div class="bg-indigo-50 p-4 rounded-3xl border border-indigo-100">
                <h3 class="font-semibold text-indigo-900 mb-2">今日行程</h3>
                <div v-for="event in events" class="flex gap-3 py-2 border-l-2 border-indigo-300 pl-3 mb-2">
                    <span class="text-xs font-bold text-indigo-600">{{ event.time }}</span>
                    <span class="text-sm text-gray-700">{{ event.title }}</span>
                </div>
            </div>
        </div>

        <!-- Tab 3: 隨手筆記 -->
        <div v-if="activeTab === 'notes'" class="space-y-4">
            <textarea v-model="note" placeholder="在這裡記錄任何靈感..." class="w-full h-64 bg-yellow-50 p-4 rounded-3xl text-gray-700 border-none resize-none"></textarea>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[480px] glass-nav flex justify-around py-3 px-6">
        <button @click="activeTab = 'todo'" :class="activeTab === 'todo' ? 'text-indigo-600' : 'text-gray-400'" class="flex flex-col items-center">
            <i data-lucide="check-circle-2"></i>
            <span class="text-[10px] mt-1 font-medium">任務</span>
        </button>
        <button @click="activeTab = 'calendar'" :class="activeTab === 'calendar' ? 'text-indigo-600' : 'text-gray-400'" class="flex flex-col items-center">
            <i data-lucide="calendar"></i>
            <span class="text-[10px] mt-1 font-medium">行程</span>
        </button>
        <button @click="activeTab = 'notes'" :class="activeTab === 'notes' ? 'text-indigo-600' : 'text-gray-400'" class="flex flex-col items-center">
            <i data-lucide="edit-3"></i>
            <span class="text-[10px] mt-1 font-medium">筆記</span>
        </button>
    </nav>
</div>

<script>
    const { createApp, ref, computed, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const activeTab = ref('todo');
            const newTask = ref('');
            const note = ref(localStorage.getItem('myNote') || '');
            const todos = ref(JSON.parse(localStorage.getItem('myTodos')) || [
                { text: '規劃下週專案進度', done: false },
                { text: '回覆合作郵件', done: true }
            ]);

            const events = ref([
                { time: '10:00', title: '團隊週會' },
                { time: '14:30', title: '品牌設計審查' }
            ]);

            const todayDate = new Date().toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' });

            const currentTabName = computed(() => {
                const names = { todo: '我的任務', calendar: '行程規劃', notes: '隨手筆記' };
                return names[activeTab.value];
            });

            const addTodo = () => {
                if (newTask.value.trim()) {
                    todos.value.unshift({ text: newTask.value, done: false });
                    newTask.value = '';
                    saveTodos();
                }
            };

            const saveTodos = () => {
                localStorage.setItem('myTodos', JSON.stringify(todos.value));
            };

            // 監聽並保存筆記
            const saveNote = () => {
                localStorage.setItem('myNote', note.value);
            };

            onMounted(() => {
                lucide.createIcons();
            });

            return { activeTab, todos, newTask, note, events, todayDate, currentTabName, addTodo, saveNote };
        },
        updated() {
            lucide.createIcons(); // 確保切換頁面時圖標能正確渲染
        }
    }).mount('#app');
</script>
</body>
</html>
