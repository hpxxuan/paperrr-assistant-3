<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr 2.0 - 週度執行</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { background-color: #FFF9FA; font-family: 'Noto Sans TC', sans-serif; color: #4A5568; margin: 0; padding: 20px; }
        
        /* 截圖中的圓形日期按鈕樣式 */
        .date-circle { width: 70px; height: 90px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s; cursor: pointer; }
        .date-circle.active { background: #EE4D9B; color: white; border-radius: 40px; box-shadow: 0 10px 25px rgba(238, 77, 155, 0.4); transform: scale(1.1); z-index: 10; }
        .date-circle.inactive { background: white; color: #A0AEC0; border-radius: 40px; border: 1px solid #F7FAFC; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }

        /* 任務卡片樣式 */
        .task-card { background: white; border-radius: 40px; padding: 25px 35px; border: 1px solid #FEE2E2; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; align-items: center; margin-bottom: 15px; }
        .task-dot { width: 22px; height: 22px; border: 2px solid #FEE2E2; border-radius: 50%; margin-right: 20px; }
        .tag-small { font-size: 10px; padding: 2px 10px; border-radius: 12px; color: white; margin-right: 15px; font-weight: bold; }

        /* 彈窗輸入框樣式 */
        .modal-overlay { background: rgba(0,0,0,0.2); backdrop-filter: blur(8px); }
        .modal-content { background: white; border-radius: 40px; width: 100%; max-width: 500px; padding: 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); }
        .input-field { background: #F8FAFC; border: 1px solid #EDF2F7; border-radius: 20px; padding: 15px 20px; width: 100%; outline: none; transition: 0.2s; }
        .input-field:focus { border-color: #EE4D9B; background: white; }
    </style>
</head>
<body>

<div id="app" class="max-w-[1000px] mx-auto">
    <!-- Header: 標誌與實時同步標籤 -->
    <header class="flex justify-between items-start mb-10">
        <div>
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gradient-to-br from-[#FF7EAD] to-[#FF4E8E] rounded-3xl flex items-center justify-center shadow-lg">
                    <span class="text-white text-3xl">P</span>
                </div>
                <h1 class="text-[42px] font-black text-[#1A2B48] leading-none">Paperrr<span class="text-[#FF7E39]">✸</span>2.0</h1>
            </div>
            <div class="mt-2 inline-flex items-center gap-2 bg-[#E8F9F1] text-[#3BB574] px-4 py-1.5 rounded-full text-[10px] font-bold">
                ● 雲端實時同步中
            </div>
        </div>
        <div class="flex bg-white rounded-full p-1 shadow-sm border border-gray-50">
            <button class="px-6 py-2 text-gray-300 text-sm font-bold">年度計畫</button>
            <button @click="viewMode = 'month'" class="px-6 py-2 text-gray-300 text-sm font-bold">月度概覽</button>
            <button class="px-6 py-2 bg-[#EE4D9B] text-white rounded-full text-sm font-bold shadow-md">週度執行</button>
        </div>
    </header>

    <!-- 週度日期滾動條 (參照截圖一) -->
    <div class="flex items-center justify-between mb-12 px-4">
        <button class="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-gray-300">❮</button>
        <div class="flex gap-4">
            <div v-for="(d, idx) in weekDays" :key="idx" 
                 :class="['date-circle', d.day === 15 ? 'active' : 'inactive']"
                 @click="selectedDay = d.day">
                <span class="text-[9px] font-bold mb-1 uppercase tracking-tighter">Day {{ d.day }}</span>
                <span class="text-2xl font-black">{{ d.week }}</span>
            </div>
        </div>
        <button class="w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center text-pink-400">❯</button>
    </div>

    <!-- 今日計畫追蹤卡片 (參照截圖一) -->
    <div class="bg-white/60 backdrop-blur-md border border-white rounded-[50px] p-10 shadow-2xl shadow-pink-100">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-[48px] font-black text-[#1A2B48]">5月15日</h2>
                <div class="flex items-center gap-2 text-pink-400 text-xs font-bold">
                    <span>⚡ 實時計畫同步</span>
                </div>
            </div>
            <button @click="showModal = true" class="bg-gradient-to-r from-[#FF5E9B] to-[#FF7E39] text-white px-8 py-4 rounded-3xl font-bold flex items-center gap-2 shadow-lg hover:scale-105 transition">
                <span>+</span> 新增詳細計畫
            </button>
        </div>

        <div class="flex items-center gap-2 mb-6">
            <span class="text-pink-500">◎</span>
            <h3 class="text-xl font-black text-[#1A2B48]">今日計畫追蹤✦</h3>
        </div>

        <!-- 任務列表 -->
        <div class="task-card">
            <div class="task-dot"></div>
            <span class="tag-small bg-[#FF9ECA]">工作</span>
            <span class="text-2xl font-bold text-[#1A2B48]">腳本討論</span>
        </div>

        <div class="task-card">
            <div class="task-dot"></div>
            <span class="tag-small bg-[#7FBFFF]">上片</span>
            <span class="text-2xl font-bold text-[#1A2B48] flex-1">美眼儀</span>
            <div class="flex items-center gap-4">
                <div class="bg-orange-50 text-orange-400 px-4 py-1.5 rounded-full text-xs font-bold border border-orange-100 flex items-center gap-2">
                    🕒 18:00
                </div>
                <div class="w-10 h-10 rounded-full border-2 border-gray-100 flex items-center justify-center text-gray-300">⏱</div>
            </div>
        </div>
    </div>

    <!-- 新增計畫彈窗 (完全復刻截圖二) -->
    <div v-if="showModal" class="fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="modal-content relative animate-in zoom-in-95 duration-200">
            <button @click="showModal = false" class="absolute top-8 right-8 text-gray-300 text-2xl">✕</button>
            <h3 class="text-2xl font-black text-[#1A2B48] mb-1">規劃新計畫</h3>
            <p class="text-[10px] font-bold text-pink-300 tracking-widest uppercase mb-8">Paperrr✸ ☁️ 計畫中心</p>

            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 block mb-2 uppercase">計畫標題</label>
                    <input class="input-field text-lg font-bold" placeholder="今天想達成什麼目標？">
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <label class="text-[10px] font-bold text-slate-400 uppercase">計畫標籤</label>
                        <button class="text-orange-400 text-[10px] font-bold">+ 建立標籤</button>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button class="px-5 py-2 bg-[#1A2B48] text-white rounded-xl text-xs font-bold shadow-lg">無分類</button>
                        <button v-for="t in ['私人','上片','工作','直播']" class="px-5 py-2 bg-white border border-gray-100 text-slate-400 rounded-xl text-xs font-bold hover:bg-pink-50">{{t}}</button>
                    </div>
                </div>

                <div class="bg-gray-50/50 p-4 rounded-[25px] border border-gray-100 flex items-center gap-4">
                    <input type="checkbox" class="w-6 h-6 border-gray-200 rounded-md">
                    <span class="text-xs font-bold text-slate-500">這是尚未安排日期的待辦事項（僅在清單顯示）</span>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 block mb-2 uppercase">開始日期</label>
                        <input type="text" value="2026/05/15" class="input-field text-sm font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 block mb-2 uppercase">結束日期</label>
                        <input type="text" value="2026/05/15" class="input-field text-sm font-bold">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 block mb-2 uppercase">具體時間</label>
                        <input type="text" placeholder="--:--" class="input-field text-sm font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 block mb-2 uppercase">地點</label>
                        <input type="text" placeholder="例如：辦公室、國外..." class="input-field text-sm font-bold">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 block mb-2 uppercase">詳細備註</label>
                    <textarea class="input-field h-24 text-sm font-medium" placeholder="紀錄更多細節..."></textarea>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref } = Vue;
    createApp({
        setup() {
            const showModal = ref(false);
            const weekDays = [
                { day: 11, week: '一' },
                { day: 12, week: '二' },
                { day: 13, week: '三' },
                { day: 14, week: '四' },
                { day: 15, week: '五' },
                { day: 16, week: '六' },
                { day: 17, week: '日' }
            ];
            return { showModal, weekDays };
        }
    }).mount('#app');
</script>
</body>
</html>
