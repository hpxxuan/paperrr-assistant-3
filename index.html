<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr 2.0 - 雲端實時同步中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { background-color: #FFF9FA; font-family: 'Noto Sans TC', sans-serif; color: #333; margin: 0; padding: 20px; }
        .glass-card { background: white; border-radius: 45px; box-shadow: 0 25px 60px rgba(255, 150, 180, 0.15); border: 1px solid #FFF1F3; padding: 40px; }
        .nav-pill { background: #FFFFFF; border-radius: 50px; padding: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .active-pill { background: linear-gradient(135deg, #EE4D9B 0%, #E33E84 100%); color: white; box-shadow: 0 5px 15px rgba(238, 77, 155, 0.4); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid #F3F4F6; border-radius: 20px; overflow: hidden; background: #FFF; }
        .cell { aspect-ratio: 1 / 1.1; border: 0.5px solid #F9FAFB; padding: 8px; position: relative; cursor: pointer; transition: 0.2s; }
        .cell:hover { background-color: #FFF5F7; }
        .today-circle { background: #EE4D9B; color: white; border-radius: 50%; width: 22px; height: 22px; display: flex; items-center: center; justify-content: center; font-size: 11px; }
        .tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-bottom: 2px; color: white; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* 復刻截圖中的標籤顏色 */
        .tag-green { background-color: #7FE5B6; }
        .tag-pink { background-color: #FF9ECA; }
        .tag-blue { background-color: #7FBFFF; }
        .tag-orange { background-color: #FFAA66; }
        .cloud-badge { background: #E8F9F1; color: #3BB574; font-size: 10px; padding: 4px 12px; border-radius: 50px; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div id="app" class="max-w-[1100px] mx-auto">
    <!-- Top Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 px-4">
        <div>
            <div class="flex items-center gap-3">
                <div class="w-14 h-14 bg-gradient-to-br from-[#FF7EAD] to-[#FF4E8E] rounded-3xl flex items-center justify-center shadow-lg">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <h1 class="text-[42px] font-black text-[#1A2B48] leading-none">Paperrr<span class="text-[#FF7E39]">✸</span>2.0</h1>
            </div>
            <div class="flex items-center gap-2 mt-2">
                <div class="cloud-badge font-bold">
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M17.5,19c-3.037,0-5.5-2.463-5.5-5.5c0-3.037,2.463-5.5,5.5-5.5s5.5,2.463,5.5,5.5C23,16.537,20.537,19,17.5,19z M17.5,10 c-1.933,0-3.5,1.567-3.5,3.5s1.567,3.5,3.5,3.5s3.5-1.567,3.5-3.5S19.433,10,17.5,10z"/><path d="M11.5,19H6c-2.757,0-5-2.243-5-5c0-2.32,1.59-4.27,3.73-4.85C5.25,6.01,8.19,3.5,11.5,3.5c2.47,0,4.64,1.4,5.69,3.46 C17.3,6.98,17.4,7,17.5,7c0.17,0,0.33,0.01,0.5,0.03V9.1c-0.33-0.06-0.66-0.1-1-0.1c-3.58,0-6.5,2.92-6.5,6.5 c0,1.25,0.36,2.41,0.98,3.4C11.49,18.94,11.49,18.97,11.5,19z"/></svg>
                    雲端實時同步中
                </div>
            </div>
        </div>

        <div class="nav-pill flex items-center mt-6 md:mt-0">
            <button class="px-8 py-2.5 rounded-full text-sm font-bold text-gray-400">年度計畫</button>
            <button class="px-8 py-2.5 rounded-full text-sm font-bold active-pill">月度概覽</button>
            <button class="px-8 py-2.5 rounded-full text-sm font-bold text-gray-400">週度執行</button>
        </div>
    </header>

    <!-- Main Calendar -->
    <div class="glass-card">
        <!-- Month Controller -->
        <div class="flex justify-between items-center mb-10">
            <button class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center text-pink-400 hover:bg-pink-100">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <h2 class="text-2xl font-bold text-[#1A2B48]">2026年 5月</h2>
            <button class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center text-pink-400 hover:bg-pink-100">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>

        <!-- Week Headers -->
        <div class="grid grid-cols-7 mb-4 text-center">
            <div v-for="w in ['一','二','三','四','五','六','日']" class="text-[#FFB38E] text-sm font-medium">{{w}}</div>
        </div>

        <!-- Grid Container -->
        <div class="calendar-grid">
            <!-- Offset -->
            <div v-for="i in 4" class="cell bg-[#FAFBFF]/30"></div>
            
            <!-- Day Cells -->
            <div v-for="day in 31" :key="day" class="cell flex flex-col items-start gap-1" @click="editDay(day)">
                <div :class="day === 14 ? 'today-circle' : 'text-gray-300 font-bold text-[11px]'">{{day}}</div>
                
                <!-- 渲染對應日期的彩色標籤 (完全參照截圖二資訊) -->
                <div class="w-full mt-1">
                    <template v-for="plan in getPlans(day)">
                        <div :class="['tag', plan.color]">{{plan.text}}</div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-8 flex items-center gap-2 px-4">
        <h2 class="text-2xl font-bold text-[#1A2B48]">計畫規劃◆</h2>
    </div>
</div>

<script>
    const { createApp, ref } = Vue;
    createApp({
        setup() {
            // 預設資料：完整復刻截圖二中的行程資訊
            const dailyPlans = ref({
                12: [{ text: '泰瑞-品心', color: 'tag-green' }],
                13: [{ text: '月會', color: 'tag-pink' }],
                15: [{ text: '腳本討論', color: 'tag-pink' }, { text: '美眼儀', color: 'tag-blue' }],
                18: [{ text: '薇佳20:00', color: 'tag-orange' }, { text: '水湧拍攝', color: 'tag-pink' }],
                19: [{ text: '內部拍攝', color: 'tag-pink' }],
                20: [{ text: 'lulu 12:00 po 限動', color: 'tag-pink' }],
                21: [{ text: '薇佳8:00', color: 'tag-orange' }, { text: '歐漾20:00', color: 'tag-orange' }],
                22: [{ text: '寶雅5檔依克多因', color: 'tag-blue' }, { text: '出國行程確認', color: 'tag-pink' }],
                25: [{ text: '薇佳19:00', color: 'tag-orange' }, { text: '歐漾21:00', color: 'tag-orange' }],
                27: [{ text: 'mia直播', color: 'tag-pink' }]
            });

            const getPlans = (day) => dailyPlans.value[day] || [];

            const editDay = (day) => {
                const text = prompt(`在 ${day} 日新增計畫內容:`);
                if (text) {
                    const colors = ['tag-pink', 'tag-blue', 'tag-green', 'tag-orange'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    if (!dailyPlans.value[day]) dailyPlans.value[day] = [];
                    dailyPlans.value[day].push({ text, color });
                }
            };

            return { dailyPlans, getPlans, editDay };
        }
    }).mount('#app');
</script>
</body>
</html>
