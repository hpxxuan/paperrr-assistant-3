<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr 2.0</title>
    <!-- 強制加載 Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { 
            background-color: #FFF5F7 !important; 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0;
            padding: 20px;
        }
        .app-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid #FFFFFF;
            box-shadow: 0 20px 50px rgba(255, 182, 193, 0.3);
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .pink-btn {
            background: linear-gradient(135deg, #FF5E9B 0%, #FF4181 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 129, 0.3);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border: 1px solid #FEE2E2;
            background: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
        }
        .cell {
            aspect-ratio: 1 / 1.1;
            border: 0.5px solid #F3F4F6;
            padding: 10px;
            font-size: 12px;
            color: #9CA3AF;
            cursor: pointer;
        }
        .cell:hover { background-color: #FFF9FA; }
    </style>
</head>
<body>

<div id="app">
    <!-- Header -->
    <div class="max-w-[1000px] mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 pink-btn rounded-2xl flex items-center justify-center text-xl font-bold">P</div>
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Paperrr✸ 2.0</h1>
                <p class="text-[9px] tracking-widest text-pink-400 font-bold uppercase">Cloud Sync Plan Assistant</p>
            </div>
        </div>
        
        <div class="bg-white p-1 rounded-full shadow-inner flex">
            <button class="pink-btn px-6 py-2 rounded-full text-sm font-bold">月度概覽</button>
            <button class="px-6 py-2 text-gray-400 text-sm font-bold">週度執行</button>
        </div>
    </div>

    <!-- Main Calendar Card -->
    <div class="app-card">
        <!-- Weekdays Header -->
        <div class="grid grid-cols-7 mb-4 text-center">
            <div v-for="d in ['一','二','三','四','五','六','日']" class="text-orange-300 text-sm font-bold">{{ d }}</div>
        </div>

        <!-- Grid -->
        <div class="calendar-grid">
            <!-- Offset for Friday start (based on your screenshot) -->
            <div v-for="n in 4" class="cell bg-gray-50/50"></div>
            
            <!-- Dates -->
            <div v-for="date in 31" :key="date" class="cell flex flex-col justify-between" @click="addPlan(date)">
                <span>{{ date }}</span>
                <div v- if="plans[date]" class="bg-pink-100 text-pink-600 p-1 rounded text-[10px] truncate">
                    {{ plans[date] }}
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1000px] mx-auto mt-6">
        <h2 class="text-xl font-bold text-gray-700">計畫規劃◆</h2>
    </div>
</div>

<!-- Vue.js 放在最後確保 DOM 已加載 -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp, ref } = Vue;
    createApp({
        setup() {
            const plans = ref(JSON.parse(localStorage.getItem('user_plans') || '{}'));
            
            const addPlan = (date) => {
                const note = prompt(`在 ${date} 日新增計畫:`, plans.value[date] || '');
                if (note !== null) {
                    plans.value[date] = note;
                    localStorage.setItem('user_plans', JSON.stringify(plans.value));
                }
            };

            return { plans, addPlan };
        }
    }).mount('#app');
</script>

</body>
</html>
