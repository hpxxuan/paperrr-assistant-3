<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperrr✷ 2.0 | 計畫助理</title>
    <!-- 載入 Tailwind CSS & Vue 3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 載入 Firebase (用於雲端同步) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto+Sans+TC', sans-serif; background-color: #FFF9FA; }
        .custom-shadow { box-shadow: 0 10px 40px -10px rgba(255, 182, 193, 0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="app" class="max-w-5xl mx-auto p-4 md:p-10 pb-20">
        <!-- 頂部標題 -->
        <header class="flex flex-col md:flex-row items-center justify-between gap-6 mb-12">
            <div class="flex items-center gap-4">
                <div class="bg-pink-500 p-4 rounded-3xl text-white shadow-xl shadow-pink-100 font-black text-2xl">P</div>
                <div>
                    <h1 class="text-3xl font-black text-slate-800 tracking-tighter">Paperrr✷ 2.0</h1>
                    <p class="text-[10px] font-black text-pink-400 uppercase tracking-widest">Cloud Sync Plan Assistant</p>
                </div>
            </div>
            <!-- 視圖切換 -->
            <div class="flex gap-2 bg-white p-2 rounded-[2rem] border border-pink-50 shadow-md">
                <button @click="view = 'month'" :class="view === 'month' ? 'bg-pink-500 text-white shadow-lg' : 'text-slate-400'" class="px-8 py-2.5 rounded-3xl text-[12px] font-black transition-all">月度概覽</button>
                <button @click="view = 'week'" :class="view === 'week' ? 'bg-pink-500 text-white shadow-lg' : 'text-slate-400'" class="px-8 py-2.5 rounded-3xl text-[12px] font-black transition-all">週度執行</button>
            </div>
        </header>

        <!-- 月度概覽 (圖一：藥丸風格) -->
        <main v-if="view === 'month'" class="space-y-8 animate-in fade-in">
            <div class="bg-white p-6 rounded-[2.5rem] custom-shadow border border-pink-50">
                <div class="grid grid-cols-7 mb-4 border-b border-pink-50 pb-2 text-center text-[11px] font-black text-orange-300">
                    <div v-for="w in weekNames" :key="w">{{w}}</div>
                </div>
                <div class="grid grid-cols-7 gap-px bg-slate-50 border border-slate-50 rounded-2xl overflow-hidden">
                    <div v-for="(day, idx) in calendarDays" :key="idx" class="min-h-[110px] bg-white p-1 relative border-r border-b border-slate-50">
                        <template v-if="day">
                            <span class="text-[10px] font-black text-slate-300 ml-1">{{day.getDate()}}</span>
                            <div class="space-y-1 mt-1">
                                <div v-for="ev in getDayEvents(day)" :key="ev.id" 
                                     class="text-[10px] font-bold px-2 py-1 rounded-lg text-white truncate shadow-sm opacity-85"
                                     :style="{ backgroundColor: getTagColor(ev.tagId) }">
                                    <span v-if="ev.time" class="mr-1 opacity-70">{{ev.time}}</span>{{ev.title}}
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 計畫規劃清單 (日期排序) -->
            <div class="space-y-4">
                <h3 class="text-xl font-black text-slate-800 px-2 flex items-center gap-2">計畫規劃✦</h3>
                <div v-for="t in sortedTasks" :key="t.id" class="bg-white p-4 px-6 rounded-3xl border border-pink-50 flex items-center group hover:scale-[1.01] transition-all cursor-pointer shadow-sm">
                    <div class="shrink-0 mr-8 bg-pink-50/50 py-2 px-5 rounded-2xl">
                        <div class="flex items-center">
                            <span class="font-black text-pink-500 text-[14px]">{{formatMMDD(t.startDate)}}</span>
                            <span class="w-8"></span>
                            <span class="font-medium text-pink-300 text-[14px]">({{getWeekDay(t.startDate)}})</span>
                        </div>
                    </div>
                    <div class="font-bold text-slate-700 flex-1 truncate">{{t.title}}</div>
                </div>
            </div>
        </main>

        <!-- 週度執行 (完成反灰不槓線) -->
        <main v-else class="space-y-6">
            <div class="bg-white p-8 rounded-[3rem] custom-shadow border border-pink-50">
                <h3 class="text-2xl font-black text-slate-800 mb-8">今日計畫追蹤✦</h3>
                <div class="space-y-4">
                    <div v-for="t in todayTasks" :key="t.id" class="flex items-center gap-5 p-6 bg-slate-50/50 rounded-3xl border border-slate-100">
                        <button @click="toggleComplete(t)" :class="t.completed ? 'bg-pink-500 border-pink-500 text-white' : 'border-pink-200'" class="w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all">
                            <span v-if="t.completed">✓</span>
                        </button>
                        <h4 :class="t.completed ? 'text-slate-400' : 'text-slate-700'" class="font-black text-lg transition-all">{{t.title}}</h4>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp, ref, computed, onMounted } = Vue;

        // --- Firebase 配置 (請在此處填入您的資訊) ---
        const firebaseConfig = {
            apiKey: "您的_API_KEY",
            authDomain: "您的專案ID.firebaseapp.com",
            projectId: "您的專案ID",
            storageBucket: "您的專案ID.appspot.com",
            messagingSenderId: "您的發送者ID",
            appId: "您的應用程式ID"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = 'paperrr-v2-tags-sync';

        createApp({
            setup() {
                const view = ref('month');
                const tasks = ref([]);
                const tags = ref([]);
                const user = ref(null);
                const currentDate = ref(new Date());
                const weekNames = ["一", "二", "三", "四", "五", "六", "日"];

                onMounted(() => {
                    auth.onAuthStateChanged(u => {
                        if (!u) auth.signInAnonymously();
                        user.value = u;
                        if(u) loadData(u.uid);
                    });
                });

                const loadData = (uid) => {
                    db.collection(`artifacts/${appId}/users/${uid}/tasks`).onSnapshot(s => tasks.value = s.docs.map(d => ({...d.data(), id: d.id})));
                    db.collection(`artifacts/${appId}/users/${uid}/tags`).onSnapshot(s => tags.value = s.docs.map(d => ({...d.data(), id: d.id})));
                };

                const sortedTasks = computed(() => [...tasks.value].sort((a,b) => new Date(a.startDate) - new Date(b.startDate)));
                const todayTasks = computed(() => tasks.value.filter(t => t.startDate === new Date().toISOString().split('T')[0]));

                const calendarDays = computed(() => {
                    const y = currentDate.value.getFullYear();
                    const m = currentDate.value.getMonth();
                    const dInM = new Date(y, m + 1, 0).getDate();
                    const first = (new Date(y, m, 1).getDay() + 6) % 7;
                    const res = Array(first).fill(null);
                    for(let i=1; i<=dInM; i++) res.push(new Date(y,m,i));
                    return res;
                });

                const getDayEvents = (day) => {
                    const s = day.toISOString().split('T')[0];
                    return tasks.value.filter(t => t.startDate === s);
                };

                const formatMMDD = (s) => s.split('-').slice(1).join(' / ');
                const getWeekDay = (s) => weekNames[(new Date(s).getDay() + 6) % 7];
                const getTagColor = (id) => tags.value.find(t => t.id === id)?.color || '#FF82BA';
                const toggleComplete = (t) => db.collection(`artifacts/${appId}/users/${user.value.uid}/tasks`).doc(t.id).update({completed: !t.completed});

                return { view, weekNames, sortedTasks, todayTasks, calendarDays, getDayEvents, formatMMDD, getWeekDay, getTagColor, toggleComplete };
            }
        }).mount('#app');
    </script>
</body>
</html>
